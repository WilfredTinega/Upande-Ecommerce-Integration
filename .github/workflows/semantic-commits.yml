name: Semantic Commits

# One job, so a PR shows one check rather than a row per concern.
#
# On a PR: the title must be a Conventional Commit (semantic-release reads the
# squash commit, which takes the PR title, to compute the next version), and the
# branch's commits must carry no Claude attribution — GitHub copies
# Co-authored-by trailers from the squashed commits onto the squash commit
# regardless of squash_merge_commit_message, so the trailer has to be gone
# before the merge button is pressed.
#
# On a push to main: verify none got through. main is never rewritten here — it
# carries release tags and semantic-release commits, so a force-push would
# orphan them.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: the job force-pushes, and a cancelled rewrite is
  # worse than a redundant lint run.
  group: commitcheck-ecommerce-integration-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  commits:
    name: Title and attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # ---- pull_request ----
      - name: Resolve target branch
        id: target
        if: github.event_name == 'pull_request'
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "$PR_BRANCH" = "main" ]; then
            echo "::error::Refusing to rewrite main."
            exit 1
          fi
          if [ -n "${PR_REPO:-}" ] && [ "$PR_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR is from fork $PR_REPO; cannot push to it. The contributor must clean the branch."
            exit 1
          fi
          echo "branch=$PR_BRANCH" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Write message filter
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/strip-claude-trailer.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          # Command substitution drops the trailing newlines the deletion leaves
          # behind; printf restores exactly one.
          out="$(sed \
            -e '/^[[:space:]]*Co-[Aa]uthored-[Bb]y:[[:space:]]*Claude/d' \
            -e '/Generated with \[Claude Code\]/d')"
          printf '%s\n' "$out"
          SH
          chmod +x "$RUNNER_TEMP/strip-claude-trailer.sh"

      - name: Strip Claude attribution from branch commits
        id: rewrite
        if: github.event_name == 'pull_request'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail

          base="$(git merge-base origin/main HEAD)"
          start="$(git rev-parse HEAD)"
          echo "start=$start" >>"$GITHUB_OUTPUT"
          echo "Range: ${base:0:9}..$BRANCH ($(git rev-list --count "$base"..HEAD) commits)"

          # Captured, not piped into `if !`: a git failure inside a pipeline or
          # command substitution does not trip `set -e`, and would be
          # indistinguishable from "no matches" — a false pass.
          if ! msgs="$(git log --format='%B' "$base"..HEAD)"; then
            echo "::error::Could not read commit messages for $base..HEAD"
            exit 1
          fi

          if ! printf '%s' "$msgs" |
               grep -q -e '[Cc]o-[Aa]uthored-[Bb]y: Claude' \
                       -e 'Generated with \[Claude Code\]'; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Branch is already clean."
            exit 0
          fi

          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch -f \
            --msg-filter "$RUNNER_TEMP/strip-claude-trailer.sh" \
            "$base"..HEAD

          # Messages only: the tree must be byte-identical or we do not push.
          if ! git diff --quiet "$start" HEAD; then
            echo "::error::Rewrite changed file content - aborting without pushing."
            git diff --stat "$start" HEAD
            exit 1
          fi

          if git log --format='%B' "$base"..HEAD |
             grep -q -e '[Cc]o-[Aa]uthored-[Bb]y: Claude' \
                     -e 'Generated with \[Claude Code\]'; then
            echo "::error::Attribution still present after rewrite - aborting."
            exit 1
          fi

          echo "changed=true" >>"$GITHUB_OUTPUT"
          echo "Rewrote ${start:0:9} -> $(git rev-parse --short=9 HEAD), trees identical."

      - name: Force-push the cleaned branch
        if: github.event_name == 'pull_request' && steps.rewrite.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          START: ${{ steps.rewrite.outputs.start }}
        run: |
          set -euo pipefail
          # Lease pinned to the sha this job started from: a push that landed
          # while it ran is refused rather than clobbered.
          git push --force-with-lease="$BRANCH:$START" origin "HEAD:$BRANCH"
          echo "::notice::Branch $BRANCH rewritten. Anyone with it checked out must run: git fetch origin && git reset --hard origin/$BRANCH"

      # ---- push to main ----

      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
          check-latest: true

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save --no-package-lock @commitlint/cli @commitlint/config-conventional
          echo "$PR_TITLE" | npx commitlint --verbose

      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Verify no attribution reached main
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No usable before-sha (new branch or force-push); checking tip only."
            range="$AFTER~1..$AFTER"
          else
            range="$BEFORE..$AFTER"
          fi

          if ! commits="$(git rev-list "$range")"; then
            echo "::error::Could not enumerate $range"
            exit 1
          fi

          found=0
          while read -r sha; do
            [ -n "$sha" ] || continue
            if ! body="$(git log -1 --format='%B' "$sha")"; then
              echo "::error::Could not read $sha"
              exit 1
            fi
            if printf '%s' "$body" |
               grep -q -e '[Cc]o-[Aa]uthored-[Bb]y: Claude' \
                       -e 'Generated with \[Claude Code\]'; then
              echo "::error::$sha $(git log -1 --format='%s' "$sha")"
              found=1
            fi
          done <<<"$commits"

          if [ "$found" -eq 1 ]; then
            echo "::error::Claude attribution reached main. main is not auto-rewritten: it carries release tags and semantic-release commits, so a force-push would orphan them. Make this check required on main so no PR can merge while its commits still carry a trailer."
            exit 1
          fi
          echo "Clean: no Claude attribution in $range"
